<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="Your library, notes and reading statistics." />
		<meta name="theme-color" content="#fcf8ff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0e0d18" media="(prefers-color-scheme: dark)" />
		<link rel="icon" href="/favicon.png" type="image/png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<title>Kozeki</title>
		<script>
			// Applied before first paint so a dark-mode reload does not flash white.
			try {
				const stored = localStorage.getItem('kozeki.theme');
				const dark = stored === 'dark' || (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
				if (dark) document.documentElement.classList.add('dark');
			} catch {}
		</script>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
