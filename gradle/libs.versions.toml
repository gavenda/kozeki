[versions]
agp = "9.4.1"
kotlin = "2.4.20"
ksp = "2.3.12"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.10.2"
browser = "1.10.0"
composeBom = "2026.09.00"
#noinspection GradleDependency
compose-material3 = "1.5.0-alpha29"
material3Adaptive = "1.3.0"
materialIconsExtended = "1.7.8"
materialKolor = "6.0.0-beta01"
room = "2.8.5"
datastore = "1.2.1"
work = "2.12.0"
